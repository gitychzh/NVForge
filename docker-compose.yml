  dsvf0731_nv40666:
    # R-dsv4f-0731 (2026-08-04): deepseek-v4-flash 0731 (6166b605) 独立容器.
    # pexec 全 key 超时/400; integrate 路径 1s 200 OK. 故 NV_INTEGRATE_MODELS=dsv4f_nv 强制走 integrate.
    # hm4104 + opclaw4103 primary 指向此容器, 原 dsv4p_nv40066 保留不动.
    image: cc-infra-nv_gw
    container_name: dsvf0731_nv40666
    restart: unless-stopped
    ports:
    - 40666:40666
    environment:
    - LISTEN_PORT=40666
    - PROXY_ROLE=passthrough
    - PROXY_TIMEOUT=300
    - UPSTREAM_TIMEOUT=120    # R1260: 45→120. dsv4f0731 NVCF推理 8-47s + thinking budget 1024 + 大上下文 avg 62-116K chars → p95 超过 55s 被杀. 120s 覆盖 P99 推理时间
    - TIER_TIMEOUT_BUDGET_S=600  # R1260: 180→600. 配合 UPSTREAM_TIMEOUT=120 × fastbreak=5
    - KEY_COOLDOWN_S=30
    - TIER_COOLDOWN_S=90
    - MIN_OUTBOUND_INTERVAL_S=5
    - NVU_CONNECT_RESERVE_S=0
    - NVU_FORCE_STREAM_UPGRADE=1    # R1260: 0→1. 非流式请求升级为流式上游, SSE 累积后以非流式 JSON 返回. 避免 read 超时杀完整响应
    - NVU_FORCE_STREAM_UPGRADE_TIMEOUT=120    # R1260: 新增. 默认55s 杀 >55s 的 thinking 请求. 120s 与 UPSTREAM_TIMEOUT 对齐, 给 dsv4f0731 thinking budget 1024 足够时间
    - NVU_EMPTY_200_FASTBREAK=3
    - NVU_PEXEC_TIMEOUT_FASTBREAK=5    # R1260: 3→5. 连续 3 次 timeout 太激进, 大上下文请求接近全部超. 5 次给更多 key 尝试机会
    - NVU_CONN_ERR_FAST_BREAK=5  # R1016: 76% NVCFPexecRemoteDisconnected, 2-consec fast-break 太激进, 全 5 key 循环再放弃
    - NVU_SSLEOF_RETRY_DELAY_S=1.0
    - NVU_PEER_FALLBACK_ENABLED=0
    - NVU_MS_FALLBACK_ENABLED=0
    - NVU_DISABLE_MS_FALLBACK=1
