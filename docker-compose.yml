    - PRIMARY_URL=http://dsvf0731_nv40666:40666/v1  # R-adapter-relink: primary 保持 dsv4f_nv@40666 (flash 0731)
    - PRIMARY_MODEL=dsv4f0731_nv  # R-dsv4f0731 (2026-08-05): primary 模型从 dsv4f_nv 改为 dsv4f0731_nv, 与 fallback dsv4f0731_ms 版本对称统一 (40666 容器已新增该模型)
