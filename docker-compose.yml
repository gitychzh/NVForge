    - FALLBACK_TIMEOUT_S=120
    - PRIMARY_STREAM_TIMEOUT_S=90
    - PRIMARY_HEADER_TIMEOUT=180    # R2: 120→180. 120s 对 185K+ input 仍不够 (07:02 满 120s fail), 提至 180s 给 nv_gw 完整 key 重试窗口 (NVU_STREAM_FB_200K_S=90 × 2 次 = 180s)
    - FALLBACK_HEADER_TIMEOUT=70  # Ropenclaw: 180→70. primary 90s + fallback 70s = 160s < 170s PROXY_TIMEOUT < 180s openclaw timeout. Was 180s causing total 360s chain. 回滚=180.  # R686: fallback→nv_gw(glm5_2_nv), 180s 覆盖 nv_gw tier budget 120s + 余量
    - CIRCUIT_FAILURE_THRESHOLD=8    # R1: 5→8. 大 input 慢流容易在 5 次内触 breaker OPEN, 提至 8 增加容错
    - CIRCUIT_OPEN_S=60
    - FALLBACK_RECOVER_S=30     # R2: 120→30. 死锁: 120s 冷却期内新请求持续跳 primary → 永无 primary 成功 → breaker 永不开锁. 30s 对齐 nv_gw KEY_COOLDOWN_S=25, 让 key 冷却后快速回归 primary
    - CC4101_TOTAL_BUDGET_S=360  # R_hm4104_fix: 80→360, 让 primary-retry-after-fallback 条件 remaining>=PRIMARY_HEADER_TIMEOUT(180) 能成立
    - NV_GW_API_KEY=nv-gw-token
    - MS_GW_API_KEY=ms-gw-token  # R1248: fallback→ms_gw(40007), forwarder 的 FALLBACK 路径用 MS_GW_API_KEY 认证, 需 ms-gw-token
    - ADAPTER_API_KEY=hm-gw-token
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    volumes:
    - ./proxy/cc-adapter/gateway:/app/gateway
    - ./logs/hm4104:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - dsvf0731_nv40666  # R1247: primary 目标
    - nv_gw  # R1247: fallback 目标 (glm5_2_nv@40006)
    networks:
