  dsvf0731_nv40666:
    # R-dsv4f-0731 (2026-08-04): deepseek-v4-flash 0731 (6166b605) 独立容器.
    # pexec 全 key 超时/400; integrate 路径 1s 200 OK. 故 NV_INTEGRATE_MODELS=dsv4f_nv 强制走 integrate.
    # hm4104 + opclaw4103 primary 指向此容器, 原 dsv4p_nv40066 保留不动.
    image: cc-infra-nv_gw
    container_name: dsvf0731_nv40666
    restart: unless-stopped
    ports:
    - 40666:40666
    environment:
    - LISTEN_PORT=40666
    - PROXY_ROLE=passthrough
    - PROXY_TIMEOUT=300
    - UPSTREAM_TIMEOUT=45    # R1006-self: 50→45. pexec_success p95=38.9s(24h), 50s ceiling 让 hung conn 烧满 43.5s×3≈129s≈180s budget→fast-break→all_tiers_exhausted. 45s 覆盖 p95 留 6s 余量, 每 hung 省 ~5s, 3 次省 15s=多一次 key 重试
    - TIER_TIMEOUT_BUDGET_S=180
    - KEY_COOLDOWN_S=30
    - TIER_COOLDOWN_S=90
    - MIN_OUTBOUND_INTERVAL_S=5
    - NVU_CONNECT_RESERVE_S=0
    - NVU_FORCE_STREAM_UPGRADE=0
    - NVU_EMPTY_200_FASTBREAK=3
    - NVU_PEXEC_TIMEOUT_FASTBREAK=3
    - NVU_CONN_ERR_FAST_BREAK=5  # R1016: 76% NVCFPexecRemoteDisconnected, 2-consec fast-break 太激进, 全 5 key 循环再放弃
    - NVU_SSLEOF_RETRY_DELAY_S=1.0
    - NVU_PEER_FALLBACK_ENABLED=0
    - NVU_MS_FALLBACK_ENABLED=0
    - NVU_DISABLE_MS_FALLBACK=1
    - NVU_FID_DISCOVERY_ENABLED=1  # R-dsv4f-dynamic: FID auto-discovery
    - NVU_FID_DISCOVERY_INTERVAL_S=1800  # 30min cycle
    - NVU_FID_DISCOVERY_MODEL=dsv4f0731_nv  # R-dsv4f0731: target model→dsv4f0731_nv
    - NVU_FID_DISCOVERY_NAME_MATCH=deepseek-v4-flash  # name filter
    - NVU_STREAM_FULL_BUFFER=0
    - NVU_STREAM_ABSOLUTE_CAP_S=150
    - NVU_STREAM_FB_200K_S=90
    - NVU_TIER_BUDGET_DSV4F_NV=180
    - NVU_TIER_BUDGET_DSV4F0731_NV=180  # R1070: 220→180 revert. budget 非绑定约束 (fast-break=5 先耗尽 key), SR 未改善. all_tiers_exhausted=6 全在~180s budget cap; 5 key 全有 200 成功; 5×43.5s=217s>180 第5key被cut. 预算放宽让 fast-break=5 遍历全 5 key
    - NVU_PEER_FB_SKIP_MODELS=glm5_2_nv,dsv4p_nv,dsv4f_nv,dsv4f0731_nv  # R-dsv4f0731: 加 0731
    - NVU_HOST_MACHINE=opc2sname-dsv4f40666
    - NVU_ACTIVE_TIERS=dsv4f0731_nv  # R1254: 专职 dsv4f0731_nv, 不部署其他模型 (与 40006/40066 共用 config.py 白名单瘦身)
    - NVCF_BASE_URL=api.nvcf.nvidia.com
    # R1247: 清理多余 fid env (52e1ddb6 坏, 12acbc62 EOL, glm52/kimi 不属于此容器).
    # dsv4f0731_nv 的实际 fid 281478d0 由 NVU_FID_DISCOVERY 自动发现, 无需显式 env.
    - NV_INTEGRATE_MODELS=  # R-dsv4f-newfid: 新 FID 52e1ddb6 pexec 可用, 不再强制 integrate
    - NV_KEY_INTEGRATE_KEYS=  # R1017: revert R1015 — k5 integrate 6h SR=50%(3/6) vs pexec 70.5%(134/190), 30min 100% fail(3/3), 529_integrate_overloaded=5/2h + NVStream_IncompleteRead=3. integrate 劣于 pexec, 全走 pexec DIRECT.
    - NV_INTEGRATE_PROXY_URLS=socks5h://172.18.0.1:7897,socks5h://172.18.0.1:7904,socks5h://172.18.0.1:7894,socks5h://172.18.0.1:7896,socks5h://172.18.0.1:7895
    - NV_INTEGRATE_EGRESS_IPS=134.195.101.197,134.195.101.197,134.195.101.193,134.195.101.195,134.195.101.180
    - NVU_CALLER_KEY_MAP=
    - NVU_BUFFER_CALLERS=cc4101-fallback  # R-cc-slow-fix: enable buffer for flash fallback retry
    - NVU_BUFFER_MAX_RETRIES=5  # R-cc-slow-fix: match nv_gw 40006 config
