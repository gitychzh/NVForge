    - UPSTREAM_TIMEOUT=130  # R1602: 60->130. R1412的60s是 incomplete fix: nv_gw mode chain budget=120s (NVU_TIER_BUDGET_GLM5_2_NV), NVCF劣化时合法要120s跑完5key×mode才返回502, cc4101 header 60s就抢超时误判primary失败→累计5次OPEN→503死循环(2026-07-16 01:35 实锤, 与R1412记录的2026-07-15 17:58 同一故障复发). 130s=120s chain budget+10s余量, 让nv_gw有合法时间跑完chain. 配合R1602 upstream.py 删 min(header,timeout)封顶 + should_record分流, header可等到R1420缩放值(≤120s)且误判不计数.
    - PRIMARY_HEADER_TIMEOUT=400  # R-glm52-pure: let buffer 450s manage timeout, cc4101 no pre-empt
    - CC4101_PRIMARY_FAIL_THRESHOLD=3  # R1771: 8->3. R1771时间窗语义下旧连续N次被成功重置致0<->1振荡永OPEN不了(今日10次UPSTREAM-ERROR-SEEN+34次STALL仍_fail_count=0); 改时间窗+3阈值
    - CC4101_PRIMARY_SKIP_S=30  # R1602: config默认60→30. OPEN了也更快HALF_OPEN probe, 减少卡死时长
    - UPSTREAM_IDLE_TIMEOUT=150  # R830: body read idle超时(两次chunk间隔), 对齐nv_gw thinking 150s, 容纳长思考静默期
    - CC4101_STREAM_TOTAL_DEADLINE_S=470  # R-glm52-pure: buffer 450s + 20s margin
    - PYTHONUNBUFFERED=1  # R830: 消除stdout buffer迟滞, docker logs实时可见(对齐ms_gw/nv_gw虽未设但实测实时)
    - PRIMARY_UPSTREAM_URL=http://nv_gw:40006/v1/messages  # R1255 (2026-08-13): primary=glm5_2_nv@nv_gw:40006 (死fid清理后实测 非流6/6+流式3/3 全200, 延迟3-16s; 原 dsv4f0731_nv@40666 SR81% p50 17.7s → fallback)
    - PRIMARY_UPSTREAM_TOKEN=nv-gw-token
    - PRIMARY_UPSTREAM_MODEL=glm5_2_nv  # R1255: primary model=glm5_2_nv (40006 NVCF pexec, fid 3b9748d8/bfcf495b)
    # R1255 (2026-08-13): fallback 保持 ms_gw:40007 → model 切 glm5_2_ms (同模型跨供应商, 实测 200~1.3s 7key10variant)
    - FALLBACK_UPSTREAM_URL=http://ms_gw:40007/v1/messages  # R1255: fallback=glm5_2_ms@ms_gw:40007, 跨供应商真备用 (ModelScope, 7 key)
    - FALLBACK_UPSTREAM_TOKEN=ms-gw-token  # R1255: ms_gw 用 ms-gw-token 认证
    - FALLBACK_UPSTREAM_MODEL=glm5_2_ms  # R1255: fallback model=glm5_2_ms (同模型跨供应商, 实测 200 SR 100% ~1.3s)
    - CC4101_GATEWAY_API_KEY=cc4101-token
    - CC4101_DB_ENABLED=1
    - CC4101_DB_HOST=logs_db
    - CC4101_DB_PORT=5432
    - CC4101_DB_USER=litellm
    - CC4101_DB_PASSWORD=litellm_pg_pass
    - CC4101_DB_NAME=hermes_logs
    - CC4101_HOST_MACHINE=opc2sname
    - LOG_RETENTION_DAYS=14
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    volumes:
    - ./proxy/cc4101/gateway:/app/gateway
    - ./logs/cc4101:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - dsvf0731_nv40666  # R1244: primary target (dsv4f0731_nv)
    - nv_gw  # R1244: fallback target (glm5_2_nv)
    - logs_db
    networks:
    - cc-net
    mem_limit: 1g
  dsh4106:
    # dsh4106 — DeepSeek Harness routing gateway (port 4106).
    # Transparent passthrough for dsh agent model requests.
    # Primary: dsv4p0813_nv46666 (DeepSeek V4 Pro 0813, port 46666)
    # Fallback: nv_gw (GLM-5.2, port 40006)
    # Fully decoupled: own code dir, own config, own entrypoint. No shared code with cc4101 or nv_gw.
    # Reuses cc-infra-nv_gw image (python:3.12-slim base) since Docker Hub pull is blocked.
    # The bind-mount replaces /app/gateway entirely with dsh4106's own code.
    image: cc-infra-nv_gw
    container_name: dsh4106
    restart: unless-stopped
    ports:
    - 127.0.0.1:4106:4106
    environment:
    - LISTEN_PORT=4106
    - PROXY_ROLE=dsh4106
    - AUTH_ENABLED=0  # dsh agent does not need auth (local only)
    - UPSTREAM_TIMEOUT=120
    - UPSTREAM_HEADER_TIMEOUT=120
    - UPSTREAM_IDLE_TIMEOUT=150
    - STREAM_TOTAL_DEADLINE_S=450
    - STREAM_IDLE_GAP_S=100
    - STREAM_POLL_S=5.0
    # Primary: dsv4p0813_nv46666 (DeepSeek V4 Pro 0813)
    - PRIMARY_UPSTREAM_URL=http://dsv4p0813_nv46666:46666/v1/chat/completions
    - PRIMARY_UPSTREAM_MODEL=dsv4p0813_nv
    - PRIMARY_UPSTREAM_TOKEN=nv-gw-token
    # Fallback: nv_gw (GLM-5.2)
    - FALLBACK_UPSTREAM_URL=http://nv_gw:40006/v1/chat/completions
    - FALLBACK_UPSTREAM_MODEL=glm5_2_nv
    - FALLBACK_UPSTREAM_TOKEN=nv-gw-token
    # Circuit breaker
    - PRIMARY_FAIL_THRESHOLD=5
    - PRIMARY_SKIP_S=60
    - BREAKER_WINDOW_S=300
    # Frontend model
    - FRONTEND_MODEL=deepseek-v4-pro-0813
    - DSH4106_HOST_MACHINE=opc2sname-dsh4106
    - LOG_RETENTION_DAYS=14
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    entrypoint: ["python3", "-m", "gateway.app"]
    volumes:
    - ./proxy/dsh4106/gateway:/app/gateway
    - ./logs/dsh4106:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - dsv4p0813_nv46666
    - nv_gw
    networks:
    - cc-net
    mem_limit: 512m
  cx4102:
    build: ./proxy/cx-gw
    image: cc-infra-cx4102
    container_name: cx4102
    restart: unless-stopped
    ports:
    - 127.0.0.1:4102:4102
    environment:
    - LISTEN_PORT=4102
    - AUTH_ENABLED=1
    - PROXY_TIMEOUT=120
    - PRIMARY_URL=http://nv_gw:40006/v1
    - PRIMARY_MODEL=glm5_2_nv  # R-glm52-pure: unified glm5_2_nv
    - FALLBACK_URL=none  # R-glm52-pure: disable ms fallback
    - FALLBACK_MODEL=glm5_2_ms
    - FALLBACK_TIMEOUT_S=120
    - PRIMARY_STREAM_TIMEOUT_S=150
    - CIRCUIT_FAILURE_THRESHOLD=3
    - CIRCUIT_OPEN_S=60
    - FALLBACK_RECOVER_S=30
    - CC4101_TOTAL_BUDGET_S=360  # R_hm4104_fix: 80→360, 让 primary-retry-after-fallback 条件 remaining>=PRIMARY_HEADER_TIMEOUT(180) 能成立
    - NV_GW_API_KEY=nv-gw-token
    - MS_GW_API_KEY=ms-gw-token
    - CX_GATEWAY_API_KEY=cx-gw-token
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    volumes:
    - ./proxy/cx-gw/gateway:/app/gateway
    - ./logs/cx4102:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - nv_gw
    - ms_gw
    networks:
    - cc-net
    mem_limit: 512m
  opclaw4103:
    build: ./proxy/cc-adapter
    image: cc-adapter:latest
    container_name: opclaw4103
    restart: unless-stopped
    ports:
    - 0.0.0.0:4103:4103
    environment:
    - LISTEN_PORT=4103
    - ADAPTER_NAME=opclaw4103
    - X_CALLER=openclaw  # R_hm4104_fix: 让 nv_gw CALLER_KEY_MAP 识别 caller=openclaw→绑定 key4
    - ADAPTER_ROLE=cc-adapter
    - AUTH_ENABLED=1
    - PROXY_TIMEOUT=170  # Ropenclaw: 240→170. openclaw timeoutSeconds=180, PROXY_TIMEOUT must < 180 so adapter returns error before client disconnects. Was 240>180 causing "Agent couldn't generate a response". 回滚=240.
    - PRIMARY_URL=http://oc45001:45001/v1  # R-oc45001: primary→远程 oc45001 容器(45001) big-pickle (opencode zen 免费模型), 2026-08-14 替换原 ms_gw glm5_2_ms
    - PRIMARY_MODEL=big-pickle  # R-oc45001: opencode zen big-pickle (oc45001 网关)
    - FALLBACK_URL=http://dsvf0731_nv40666:40666/v1  # R1265: fallback→dsv4f0731_nv40666 (NVCF), 与 hm4104 对齐. 原 nv_gw:40006 移除.
    - FALLBACK_MODEL=dsv4f0731_nv  # R1265: fallback model=dsv4f0731_nv (dsv4f0731_nv40666, NVCF pexec)
    - FALLBACK_ENABLED=1  # R1265: 开启 fallback (oc45001 全败→dsv4f0731_nv40666)
    - FALLBACK_TIMEOUT_S=120  # R1265: 对齐 hm4104
    - PRIMARY_STREAM_TIMEOUT_S=90  # oc45001 (big-pickle) primary, TTFB 1-20s, 90s 足够
    - PRIMARY_HEADER_TIMEOUT=60  # R1266: 90→60. oc45001 MAX_CONCURRENCY=3后 pacer queue ≤10s + TTFB ≤30s = 40s, 60s余量充足. 为 fallback 腾出时间
    - FALLBACK_HEADER_TIMEOUT=100  # R1266: 70→100. dsv4f0731 NVCF pexec 单key需90-120s (thinking budget 1024), 70s太短致timeout. 60+100=160<170
    - CC4101_TOTAL_BUDGET_S=170  # Must fit within PROXY_TIMEOUT (170s). non-stream retry-primary 门控需 remaining>=PRIMARY_HEADER_TIMEOUT
    - CIRCUIT_FAILURE_THRESHOLD=5  # R826: 2->5 放宽, 避免偶发empty200就OPEN全程跳primary
    - CIRCUIT_OPEN_S=60  # R826: 300->60 熔断恢复更快
    - FALLBACK_RECOVER_S=30  # Ropenclaw: 120→30. 防止 double-zombie (primary+fallback 同时降级时 30s 后重试 primary)
    - NV_GW_API_KEY=oc-proxy-token  # primary (oc45001) 入站 Bearer=OZ_GATEWAY_API_KEY
    - MS_GW_API_KEY=ms-gw-token  # 保留 (历史兼容, 未使用)
    - FALLBACK_API_KEY=nv-gw-token  # fallback=nv_gw(40006), 需要 nv-gw-token
    - ADAPTER_API_KEY=opclaw-gw-token
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    - PROMPT_TOKEN_LIMIT=120000
    - SUPPLEMENT_REASONING_AS_CONTENT=1
    volumes:
    - ./proxy/cc-adapter/gateway:/app/gateway
    - ./logs/opclaw4103:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - dsvf0731_nv40666  # R1265: fallback 目标 (dsv4f0731_nv@40666). primary (oc45001) 在独立 compose 项目, 不在此声明
    networks:
    - cc-net
    mem_limit: 512m
  hm4104:
    build: ./proxy/cc-adapter
    image: cc-adapter:latest
    container_name: hm4104
    restart: unless-stopped
    ports:
    - 0.0.0.0:4104:4104
    environment:
    - LISTEN_PORT=4104
    - ADAPTER_NAME=hm4104
    - X_CALLER=hermes  # R_hm4104_fix: 让 nv_gw CALLER_KEY_MAP 识别 caller=hermes→绑定 key3
    - ADAPTER_ROLE=cc-adapter
    - AUTH_ENABLED=1
    - PROXY_TIMEOUT=300  # R-fallback-timeout: 170→300. 客户端=hermes 无 openclaw 180s 硬限(该限制仅适用 opclaw4103). 300 给 fallback 200s + retry 留空间
    - PRIMARY_URL=http://dsvf0731_nv40666:40666/v1  # R-NV-default: primary→NV dsv4f0731_nv40666 (NVCF pexec, 产生更多NV请求供分析), 2026-08-17 替换原 oc45001
    - PRIMARY_MODEL=dsv4f0731_nv  # R-NV-default: primary model=dsv4f0731_nv (NVCF pexec)
    - FALLBACK_URL=http://oc45001:45001/v1  # R-NV-default: fallback→oc45001 (big-pickle, opencode zen 免费模型)
    - FALLBACK_MODEL=big-pickle  # R-NV-default: fallback model=big-pickle (oc45001 网关)
    - FALLBACK_ENABLED=1  # R-NV-default: 开启 fallback (NV 全败→oc45001 兜底)
    - FALLBACK_TIMEOUT_S=120
    - PRIMARY_STREAM_TIMEOUT_S=90
    - PRIMARY_HEADER_TIMEOUT=120    # R3: 180→120. 对齐 40666 UPSTREAM_TIMEOUT=120, 避免 hm4104 多等 60s. 40666 内部已有 key 重试逻辑
    - FALLBACK_HEADER_TIMEOUT=200  # R-fallback-timeout: 100→200. 8-16 10:17 NVCF 退化循环实测195s(empty200×3+529+conn err), 100s 提前切断致 fallback 假失败; 200s 覆盖 NVCF 慢速(125s)与全挂循环(195s)
    - CIRCUIT_FAILURE_THRESHOLD=15   # R3: 8→15. NVCF 529/timeout 间歇性, 8 次太敏感 → 断路器频繁 OPEN. 15 次给更多容错空间
    - CIRCUIT_OPEN_S=90              # R3: 60→90. NVCF 退化恢复慢(实测 5-10min), 60s 过期后 probe 仍失败 → 死循环. 90s 给 NVCF 足够恢复
    - FALLBACK_RECOVER_S=45          # R3: 30→45. 45s 冷却期内 fallback 稳定, 给 NVCF 更多恢复时间
    - CC4101_TOTAL_BUDGET_S=420  # R-fallback-timeout: 360→420. primary 180 + fallback 200 + retry 180 全预算, fallback 失败后 retry 门控仍成立
    - NV_GW_API_KEY=nv-gw-token  # R-NV-default: primary (dsv4f0731_nv40666) 入站 Bearer=NVU_GATEWAY_API_KEY
    - FALLBACK_API_KEY=oc-proxy-token  # R-NV-default: fallback (oc45001) 入站 Bearer=OZ_GATEWAY_API_KEY
    - MS_GW_API_KEY=ms-gw-token  # 保留兼容 (ms_gw 不再作为 fallback 目标)
    - ADAPTER_API_KEY=hm-gw-token
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    volumes:
    - ./proxy/cc-adapter/gateway:/app/gateway
    - ./logs/hm4104:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - dsvf0731_nv40666  # R1264: fallback 目标 (dsv4f0731_nv40666, primary=oc45001 为独立 compose 不在此)
    - nv_gw  # 保留 (历史依赖, nv_gw 不再直接参与 hm4104 链路)
    networks:
    - cc-net
    mem_limit: 512m
  oc4105:
    build: ./proxy/cc-adapter
    image: cc-adapter:latest
    container_name: oc4105
    restart: unless-stopped
    ports:
    - 0.0.0.0:4105:4105
    environment:
    - LISTEN_PORT=4105
    - ADAPTER_NAME=oc4105
    - X_CALLER=opencode  # 40666 侧 CALLER_KEY_MAP: caller=opencode→绑定 key5 (fallback 上游)
    - PRIMARY_HEADER_TIMEOUT=180   # 2026-08-15: primary 换 oc45001 (Zen 实测 ttfb 均值16s/p90 32s), 对齐 hm4104 参数
    - ADAPTER_ROLE=cc-adapter
    - AUTH_ENABLED=1
    - PROXY_TIMEOUT=300
    - PRIMARY_URL=http://oc45001:45001/v1  # 2026-08-15: primary=bp45001 (oc45001 big-pickle=DeepSeek V4 Pro via OpenCode Zen)
    - PRIMARY_MODEL=big-pickle
    - FALLBACK_URL=http://dsvf0731_nv40666:40666/v1  # 2026-08-15: fallback=dsv4f0731_nv40666 (NVCF), 原 ms_gw 链路移除
    - FALLBACK_MODEL=dsv4f0731_nv
    - FALLBACK_ENABLED=1
    - FALLBACK_TIMEOUT_S=300
    - FALLBACK_HEADER_TIMEOUT=200  # R-fallback-timeout: 100→200. NVCF 退化循环实测195s, 100s 提前切断致 fallback 假失败. oc4105 PROXY_TIMEOUT=300 容纳
    - PRIMARY_STREAM_TIMEOUT_S=90
    - CIRCUIT_FAILURE_THRESHOLD=3
    - CIRCUIT_OPEN_S=60
    - FALLBACK_RECOVER_S=30
    - CC4101_TOTAL_BUDGET_S=400  # R-fallback-timeout: 360→400. primary 180 + fallback 200 + retry 180 全预算
    - NV_GW_API_KEY=oc-proxy-token  # primary (oc45001) 入站 Bearer=OZ_GATEWAY_API_KEY
    - MS_GW_API_KEY=ms-gw-token  # 保留未用 (兼容)
    - FALLBACK_API_KEY=nv-gw-token  # fallback (dsvf0731_nv40666) 入站 Bearer=NVU_GATEWAY_API_KEY
    - ADAPTER_API_KEY=oc-gw-token
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    volumes:
    - ./proxy/cc-adapter/gateway:/app/gateway
    - ./logs/oc4105:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - dsvf0731_nv40666  # fallback target; primary oc45001 为独立 compose 项目, 不在此 depends_on 内
    networks:
    - cc-net
    mem_limit: 512m
networks:
  cc-net:
    driver: bridge
volumes:
  cc_pgdata: null

