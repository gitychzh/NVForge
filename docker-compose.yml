    - NVU_EGRESS_IP4=134.195.101.195
    - NVU_EGRESS_IP5=134.195.101.180
    - NVU_GATEWAY_API_KEY=nv-gw-token
    - NVU_DB_ENABLED=1
    - NVU_DB_HOST=logs_db
