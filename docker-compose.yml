    - NVU_STREAM_ABSOLUTE_CAP_S=150
    - NVU_STREAM_FB_200K_S=90
    - NVU_TIER_BUDGET_DSV4F_NV=180
    - NVU_TIER_BUDGET_DSV4F0731_NV=600  # R1260: 180→600. UPSTREAM_TIMEOUT=120 × 5 fastbreak = 600s worst case. 原 180s 仅容 1.5 次 120s attempt → 必然 all_tiers_exhausted
    - NVU_PEER_FB_SKIP_MODELS=glm5_2_nv,dsv4p_nv,dsv4f_nv,dsv4f0731_nv  # R-dsv4f0731: 加 0731
    - NVU_HOST_MACHINE=opc2sname-dsv4f40666
    - NVU_ACTIVE_TIERS=dsv4f0731_nv  # R1254: 专职 dsv4f0731_nv, 不部署其他模型 (与 40006/40066 共用 config.py 白名单瘦身)
    - NVCF_BASE_URL=api.nvcf.nvidia.com
    # R1247: 清理多余 fid env (52e1ddb6 坏, 12acbc62 EOL, glm52/kimi 不属于此容器).
