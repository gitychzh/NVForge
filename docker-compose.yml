  opclaw4103:
    build: ./proxy/cc-adapter
    image: cc-adapter:latest
    container_name: opclaw4103
    restart: unless-stopped
    ports:
    - 0.0.0.0:4103:4103
    environment:
    - LISTEN_PORT=4103
    - ADAPTER_NAME=opclaw4103
    - X_CALLER=openclaw  # R_hm4104_fix: 让 nv_gw CALLER_KEY_MAP 识别 caller=openclaw→绑定 key4
    - ADAPTER_ROLE=cc-adapter
    - AUTH_ENABLED=1
    - PROXY_TIMEOUT=170  # Ropenclaw: 240→170. openclaw timeoutSeconds=180, PROXY_TIMEOUT must < 180 so adapter returns error before client disconnects. Was 240>180 causing "Agent couldn't generate a response". 回滚=240.
    - PRIMARY_URL=http://dsvf0731_nv40666:40666/v1  # R1247: primary→dsv4f0731_nv@40666 (原 dsv4p_nv40066 EOL 退役)
    - PRIMARY_MODEL=dsv4f0731_nv  # R1247: primary model=dsv4f0731_nv (40666, fid 281478d0)
    - FALLBACK_URL=http://ms_gw:40007/v1  # R1248: fallback 切到 ms_gw:40007 (dsv4f0731_ms), 与 NVCF 账号解耦
    - FALLBACK_MODEL=dsv4f0731_ms  # R1248: fallback model=dsv4f0731_ms (ms_gw, 7 key 10 variant, 实测 200)
    - FALLBACK_ENABLED=1  # R1247: 开启 fallback (dsv4f0731 全败→glm5_2_nv@nv_gw)
    - FALLBACK_TIMEOUT_S=170  # Ropenclaw: 240→170 align with PROXY_TIMEOUT. 回滚=240.
    - PRIMARY_STREAM_TIMEOUT_S=90
    - PRIMARY_HEADER_TIMEOUT=90  # Ropenclaw: 180→90. Was 180s, but primary+fallback 180+180=360 >> openclaw 180s timeout. 90s covers dsv4p_nv p90 TTFB(~15s) + thinking budget. 回滚=180.  # R2303: 新增. 代码默认25s 基于旧TTFB3-14s, glm5.2恢复后integrate TTFB avg73s/max160s(近30min caller=other实测), 25s必fail切fallback致"主备均不可用". 180s对齐cc4101 glm5_2_nv大请求档覆盖73-160sTTFB. 回滚=删此行.
    - FALLBACK_HEADER_TIMEOUT=70  # Ropenclaw: 180→70. primary 90s + fallback 70s = 160s < 170s PROXY_TIMEOUT < 180s openclaw timeout. Was 180s causing total 360s chain. 回滚=180.  # R686: fallback→nv_gw(glm5_2_nv), 180s 覆盖 nv_gw tier budget 120s + 余量
    - CC4101_TOTAL_BUDGET_S=170  # Ropenclaw: 400→170. Must fit within PROXY_TIMEOUT. Was 400s >> 170s. 回滚=400.  # R2305: 80→400. 默认80<PRIMARY_HEADER_TIMEOUT(180) 致non-stream路径retry-primary门控(forwarder.py:390 remaining>=180)永不满足, fallback失败直接503"均不可用". 400给non-stream路径fallback失败后retry primary一次的机会(primary常比storming fallback恢复快). stream路径无retry(流已发message_start不能回头)不受影响,靠FALLBACK_HEADER_TIMEOUT兜. 回滚=删此行.
    - CIRCUIT_FAILURE_THRESHOLD=5  # R826: 2->5 放宽, 避免偶发empty200就OPEN全程跳primary
    - CIRCUIT_OPEN_S=60  # R826: 300->60 熔断恢复更快
    - FALLBACK_RECOVER_S=30  # Ropenclaw: 120→30. Was 120s, circuit OPEN + fallback_recover caused 2min skip-primary. If fallback also sick (double-zombie), all paths dead for 120s. 30s enough to avoid hammering sick primary. 回滚=120.
    - NV_GW_API_KEY=nv-gw-token
    - MS_GW_API_KEY=ms-gw-token  # R1248: fallback→ms_gw(40007), forwarder FALLBACK 路径用 MS_GW_API_KEY 认证, 需 ms-gw-token
    - ADAPTER_API_KEY=opclaw-gw-token
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    - PROMPT_TOKEN_LIMIT=120000
    - SUPPLEMENT_REASONING_AS_CONTENT=1
    volumes:
    - ./proxy/cc-adapter/gateway:/app/gateway
    - ./logs/opclaw4103:/app/logs
    - /etc/localtime:/etc/localtime:ro
    depends_on:
    - dsvf0731_nv40666  # R1247: primary 目标 (dsv4f0731_nv@40666)
    - nv_gw  # R1247: fallback 目标 (glm5_2_nv@40006)
    networks:
    - cc-net
    mem_limit: 512m
  hm4104:
    build: ./proxy/cc-adapter
    image: cc-adapter:latest
    container_name: hm4104
    restart: unless-stopped
    ports:
