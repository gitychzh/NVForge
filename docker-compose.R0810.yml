networks:
  cc-net:
    driver: bridge
services:
  cc4101:
    build: ./proxy/cc4101
    container_name: cc4101
    depends_on:
    - nv_gw
    - ms_gw
    - logs_db
    environment:
    - LISTEN_PORT=4101
    - PROXY_ROLE=cc4101
    - AUTH_ENABLED=1
    - UPSTREAM_TIMEOUT=90
    - UPSTREAM_IDLE_TIMEOUT=150
    - PROXY_TIMEOUT=660  # R2421 (HM2→HM1): 550→660. TIER_TIMEOUT_BUDGET_S=630 needs leaf proxy timeout to exceed it. 630+20s connect overhead=650; 660 is cc4101→nv_gw client window. Budget chain: cc4101(660)→nv_gw(500)→tier_budget(630), TIER_BUDGET < PROXY_TIMEOUT ensures inner tier can finish. Zero HM2 change, iron law.
    - PYTHONUNBUFFERED=1
    - PRIMARY_UPSTREAM_URL=http://nv_gw:40006/v1/chat/completions
    - PRIMARY_UPSTREAM_TOKEN=nv-gw-token
    - PRIMARY_UPSTREAM_MODEL=glm5_2_nv
    - FALLBACK_UPSTREAM_URL=http://ms_gw:40007/v1/chat/completions  # R0810: primary fail → ms_gw dsv4f0731_ms (0731 flash)
    - FALLBACK_UPSTREAM_TOKEN=ms-gw-token
    - FALLBACK_UPSTREAM_MODEL=dsv4f0731_ms
    - CC4101_GATEWAY_API_KEY=cc4101-token
    - CC4101_DB_ENABLED=1
    - CC4101_DB_HOST=logs_db
    - CC4101_DB_PORT=5432
    - CC4101_DB_USER=litellm
    - CC4101_DB_PASSWORD=${POSTGRES_PASSWORD}
    - CC4101_DB_NAME=hermes_logs
    - CC4101_HOST_MACHINE=opcsname
    - LOG_RETENTION_DAYS=14
    - LOG_DIR=/app/logs
    - TZ=Asia/Shanghai
    image: cc-infra-cc4101
    mem_limit: 1g
    networks:
    - cc-net
    ports:
    - 0.0.0.0:4101:4101  # R-zcode: tailscale 内 zcode 需 Anthropic 格式入口, 127→0.0.0.0
    restart: unless-stopped
    volumes:
    - ./proxy/cc4101/gateway:/app/gateway
    - ./logs/cc4101:/app/logs
    - /etc/localtime:/etc/localtime:ro
  legacy_cc_1:
    build:
      context: ./proxy/legacy-cc
      dockerfile: Dockerfile
    container_name: legacy_cc_1
    depends_on:
    - legacy_ms_litellm
    deploy: &id001
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    environment:
      CHARS_PER_TOKEN_ESTIMATE: '3.0'
      LISTEN_PORT: '40001'
      LITELLM_KEY: sk-litellm-local
      LITELLM_MODELS_URL_GLM51: http://legacy_ms_litellm:4000/v1/models
      LITELLM_URL_GLM51: http://legacy_ms_litellm:4000/v1/chat/completions
      LOG_DIR: /app/logs
      LOG_RETENTION_DAYS: '7'
      MAX_SCHEMA_DESC: '600'
      MAX_TOOL_DESC: '2000'
      MIN_OUTBOUND_INTERVAL_S: '1.5'
      MODEL_INPUT_TOKEN_SAFETY_GLM51: '170000'
      NUM_KEYS: '7'
      NUM_VARIANTS_GLM51: '10'
      NV_BASEURL: https://integrate.api.nvidia.com/v1
      NV_KEY1: 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
      NV_KEY2: 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
      NV_NUM_KEYS: '0'
      NV_PROXY_URL: http://host.docker.internal:7894
      NV_TIMEOUT: '20'
      PROXY_ROLE: cc
      PROXY_TIMEOUT: '300'
      TZ: Asia/Shanghai
      UPSTREAM_TIMEOUT: '60'
    extra_hosts: &id002
    - host.docker.internal:host-gateway
    - api-inference.modelscope.cn:47.92.141.220
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:40001/health')" || exit 1
      timeout: 5s
    logging: &id003
      driver: json-file
      options:
        max-file: '5'
        max-size: 50m
        tag: container/{{.Name}}
    networks:
    - cc-net
    ports:
    - 40001:40001
    restart: unless-stopped
    volumes:
    - ./logs/legacy-40001:/app/logs
    - /etc/localtime:/etc/localtime:ro
  legacy_cc_2:
    build:
      context: ./proxy/legacy-cc
      dockerfile: Dockerfile
    container_name: legacy_cc_2
    depends_on:
    - legacy_ms_litellm
