    - /etc/localtime:/etc/localtime:ro
  logs_db:
    container_name: logs_db
    deploy: *id004
    environment:
      POSTGRES_DB: litellm
      POSTGRES_MULTIPLE_DATABASES: litellm_glm51 litellm_nv_hm hermes_logs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: litellm
      TZ: Asia/Shanghai
    expose:
    - '5432'
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - pg_isready -U litellm -d litellm
      timeout: 5s
    image: postgres:16-alpine
    logging: *id003
    networks:
    - cc-net
    restart: unless-stopped
    volumes:
    - cc_pgdata:/var/lib/postgresql/data
    - ./postgres/init-db.sh:/docker-entrypoint-initdb.sh:ro
    - ./postgres/hermes-logs-schema.sql:/docker-entrypoint-initdb.d/20-hermes-logs-schema.sql:ro
    - /etc/localtime:/etc/localtime:ro
  ms_gw:
    build:
      context: ./proxy/ms-gw
      dockerfile: Dockerfile
    container_name: ms_gw
    deploy: *id001
    environment:
      ALL_EXHAUSTED_COOLDOWN_S: '30'
      AUTH_ENABLED: '1'
      DEFAULT_MODEL: glm5_2_ms
      EMPTY_200_FASTBREAK_THRESHOLD: '3'
      KEY_COOLDOWN_S: '30'
      LISTEN_PORT: '40007'
      LOG_DIR: /app/logs
      LOG_RETENTION_DAYS: '7'
      MIN_OUTBOUND_INTERVAL_S: '1.0'
      MSU_DB_ENABLED: '1'
