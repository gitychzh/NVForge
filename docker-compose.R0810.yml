    logging: *id003
    networks:
    - cc-net
    ports:
    - 40005:40005
    restart: unless-stopped
    volumes:
    - ./logs/legacy-40005:/app/logs
    - /etc/localtime:/etc/localtime:ro
  legacy_codex:
    build:
