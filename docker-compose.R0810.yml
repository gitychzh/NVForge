    - ./logs/ms_gw:/app/logs
    - /etc/localtime:/etc/localtime:ro
  nv_gw:
    build:
      context: ./proxy/nv-gw
      dockerfile: Dockerfile
    container_name: nv_gw
    deploy: *id001
    dns:
    - 223.5.5.5
    - 223.6.6.6
    environment:
    - CHARS_PER_TOKEN_ESTIMATE=3.0
    - FALLBACK_HEALTH_THRESHOLD=0.10
    - GPG_KEY=7169605F62C751356D054A26A821E680E5FA6305
    - HOME=/root
    - HOSTNAME=1601e13c7c0c
    - KEY_AUTHFAIL_COOLDOWN_S=0  # R2257 (HM2->HM1): authfail cooldown 25->0, eliminate dsv4p_nv pre-emption by unblocking keys immediately
    - KEY_COOLDOWN_S=25  # R1005 (HM2->HM1): 15->25. 3h: glm5_2_nv SR=39% (7OK/18total), dsv4p_nv SR=83% (5/6). Tier errors: 429_nv_rate_limit k2 + SSLEOF(2) + PexecTimeout(1) + RemoteDisconnected(1). KEY_COOLDOWN_S=15 too aggressive: NVCF 429 rate-limit window 60s+, key recycles after 15s while still rate-limited -> 429 cascade. 25s gives NVCF 1.67x longer to clear before key re-enters rotation. R1004 precedent: KEY_COOLDOWN_S=25 was stable 10h+ across all tiers. Single param; iron law: only HM1.
    - LANG=C.UTF-8
    - LISTEN_PORT=40006
    - LOG_DIR=/app/logs
    - LOG_RETENTION_DAYS=7
    - MIN_OUTBOUND_INTERVAL_S=0
    - NVCF_BASE_URL=api.nvcf.nvidia.com
    - NVCF_DEEPSEEK_FUNCTION_ID=74f02205-c7ba-438f-b81a-2537955bd7ec
    - NVCF_GLM51_FUNCTION_ID=6155636e-8ca8-4d9a-b4e5-4e8d231dfd3f
    - NVCF_GLM52_FUNCTION_ID=3b9748d8-1d85-40e8-8573-0eeaa63a4b63
    - NVCF_KIMI_FUNCTION_ID=f966661c-790d-4f71-b973-c525fb8eafd4
    - NVCF_MINIMAX_FUNCTION_ID=87ea0ddc-cff1-4bca-bf8b-3bd98a35ddd0
    - NVU_BIG_INPUT_COOLDOWN_S=180  # R2375 (HM2->HM1): 120->180. FAIL_N=3 with COOLDOWN=120s yields HALF-OPEN every 120s (probe 76s/185s=41%). 180s extends cycle to 285s, reducing probe pressure to 27%. LOWER-BOUND model: 180s OPEN gives (180-9)/(180+9)=90.5% savings vs 64.5% at 120s. Single param; iron law: only HM1. # R2364: 180->120 HALF-OPEN safe.
    - NVU_BIG_INPUT_FAIL_N=7  # R2376 (HM2->HM1): 3->5 require 5 consecutive failures to OPEN. DB: glm5_2_nv 14/19 ATE had ZERO tier_attempts (blocked before NVCF). FAIL_N=3 opens on just glm5_2 NVStream_IncompleteRead (6796ms) + ATE (26s) + empty_200 (15s) triple = identifiably transient trio, consuming 76s probe every 285s (27pct pressure). 5 needs sustained zombie pattern, not 3 transient errors. With COOLDOWN=180s backstop unchanged. Single param; iron law: only HM1.
    - NVU_BIG_INPUT_MODELS=glm5_2_nv  # R2358 (HM2->HM1): Remove dsv4p_nv — cross-model big-input breaker contamination. Shared breaker OPENs on glm5_2_nv sustained failures (FAIL_N=3 still triggers), pre-empting dsv4p_nv. dsv4p_nv 0% SR post-R2357 (12/12 instant-reject). Normal path budget=180s is better than breaker 0% SR. Single param; iron law: only HM1. R-DSV4P-ADAPTIVE: dsv4p_nv 不加入 big_input_breaker — 依赖 integrate fallback 而非 breaker 短路
    - NVU_BIG_INPUT_THRESHOLD=375000  # R2419 (HM2->HM1): 250000->375000. 6h: glm5_2_nv 60.7pct SR 7/11 ATE at 361-362K via big_input breaker HALF_OPEN 1-key probe. Breaker probe gets 429 -> back to OPEN -> self-reinforcing fail loop. 361-362K inputs below 375K go normal 5-key path with full retries + zombie detection (NV-ZOMBIE-EMPTY catches empty completion in normal path too). Zero 257-273K zombies in current 6h. R2262 precedent: 370K stopped false ATE. Single param; only HM1.
    - NVU_CONNECT_RESERVE_S=0
    - NVU_DB_ENABLED=1
    - NVU_DB_HOST=logs_db
    - NVU_DB_NAME=hermes_logs
    - NVU_DB_PASSWORD=litellm_pg_2026
    - NVU_DB_PORT=5432
    - NVU_DB_USER=litellm
    - NVU_EGRESS_IP1=134.195.101.193
    - NVU_EGRESS_IP2=134.195.101.120
    - NVU_EGRESS_IP3=134.195.101.194
    - NVU_EGRESS_IP4=134.195.101.193
    - NVU_EGRESS_IP5=134.195.101.197
    - NVU_EMPTY_200_FASTBREAK=2  # R2414 (HM2->HM1): 1->2. Post-R2413 6h: kimi_nv 14 ATE avg 98s, all tiers_tried=5 key_cycle=0. FASTBREAK=1 aborts k4+k5 on single empty_200 (50pct remaining keys). 2 gives k1->k3 recovery runway. Empty_200 key-specific transient (SR 80%+). Single param; only HM1.
    - NVU_FALLBACK_HEALTH_THRESHOLD=0.10
    - NVU_FORCE_STREAM_UPGRADE=0
    - NVU_FORCE_STREAM_UPGRADE_TIMEOUT=50
    - NVU_GATEWAY_API_KEY=nv-gw-token
    - NVU_HOST_MACHINE=opc_uname
    - NVU_INTEGRATE_THINKING_TIMEOUT_S=90
    - NVU_INTEGRATE_TIMEOUT_FASTBREAK=1
    - NVU_KEY1=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
